name: Deploy Balancy Frontend

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rebuild Frontend Container
        run: |
          # الانتقال لمسار العمل الخاص بالـ Runner وتحديث الحاوية
          cd ~/Schreibtisch/actions-runner-frontend/_work/Balancy/Balancy || true
          docker compose down
          docker compose up -d --build --force-recreate